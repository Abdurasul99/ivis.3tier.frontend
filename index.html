<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Kakao Map Example - No Marker</title>
    <script
      type="text/javascript"
      src="//dapi.kakao.com/v2/maps/sdk.js?appkey=YOUR_KAKAO_JS_KEY"
    ></script>
    <style>
      html, body {
        margin: 0; padding: 0;
        height: 100%; width: 100%;
      }
      #map {
        width: 100%; height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <script>
      var container = document.getElementById('map');
      var options = {
        center: new kakao.maps.LatLng(37.295604, 127.039178),
        level: 3
      };
      var map = new kakao.maps.Map(container, options);
    </script>
  </body>
</html>

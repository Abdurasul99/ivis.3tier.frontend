<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="IVIS 3tier">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="fms">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>3tier Dashboard </title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    .gm-bundled-control {
      display: none !important;
    }

    .gm-bundled-control .gmnoprint {
      display: none !important;
    }

    .gm-control-active,
    button.gm-control-active {
      display: none !important;
    }
  </style>

  <script>
    if (console && console.warn) {
      const originalWarn = console.warn;
      console.warn = function(...args) {
        const message = args[0];
        if (typeof message === 'string') {
          if (message.includes('HTML Renderer') ||
              message.includes('deprecated') ||
              message.includes('renderer mode')) {
            return;
          }
        }
        originalWarn.apply(console, args);
      };
    }
  </script>

  <script
    src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&loading=async"
    async
    defer
  ></script>
</head>
<body>
  <script src="flutter_bootstrap.js"></script>
</body>
</html>

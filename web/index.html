<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="IVIS 3tier">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="fms">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>3tier Dashboard </title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    .gm-bundled-control {
      display: none !important;
    }

    .gm-bundled-control .gmnoprint {
      display: none !important;
    }

    .gm-control-active,
    button.gm-control-active {
      display: none !important;
    }
  </style>

  <script>
    if (console && console.warn) {
      const originalWarn = console.warn;
      console.warn = function(...args) {
        const message = args[0];
        if (typeof message === 'string') {
          if (message.includes('HTML Renderer') ||
              message.includes('deprecated') ||
              message.includes('renderer mode')) {
            return;
          }
        }
        originalWarn.apply(console, args);
      };
    }
  </script>

  <!-- Google Maps API 로드 완료 후 Flutter를 시작 (경쟁 조건 방지) -->
  <script>
    function initMap() {
      const s = document.createElement('script');
      s.src = 'flutter_bootstrap.js';
      document.body.appendChild(s);
    }
  </script>
  <script
    src="`YOUR_GOOGLE_MAPS_API_KEY"
    async
    defer
  ></script>

  <script>
    (function () {
      let daumPostcodeLoader;

      function ensureDaumPostcodeLoaded() {
        if (window.daum && window.daum.Postcode) {
          return Promise.resolve();
        }

        if (daumPostcodeLoader) {
          return daumPostcodeLoader;
        }

        daumPostcodeLoader = new Promise(function (resolve, reject) {
          const script = document.createElement('script');
          script.src =
            'https://t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js';
          script.async = true;
          script.onload = function () {
            resolve();
          };
          script.onerror = function () {
            reject(new Error('Failed to load Daum postcode script.'));
          };
          document.head.appendChild(script);
        });

        return daumPostcodeLoader;
      }

      // Dart에서 호출: 필요할 때만 카카오 주소 검색 스크립트를 비동기로 로드
      window.openDaumPostcode = function (callback) {
        ensureDaumPostcodeLoaded()
          .then(function () {
            new daum.Postcode({
              oncomplete: function (data) {
                var road = data.roadAddress || '';
                var jibun = data.jibunAddress || '';
                callback(road, jibun);
              },
            }).open();
          })
          .catch(function (error) {
            console.error(error);
          });
      };
    })();
  </script>
</head>
<body>
  <!-- flutter_bootstrap.js는 initMap() 콜백에서 동적 로드됨 -->
</body>
</html>
